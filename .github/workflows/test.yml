name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" on a branch runs every browser test, for a PR whose pick looks too small
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Node 22 (the oldest labit supports) on every PR; 24 and 26 on a release PR and on main, where they rarely differ. A PR runs the unit
  # test files the plan picked from the reach map (the lines each file runs), over up to three jobs (node --test-shard);
  # main runs them all.
  test:
    needs: plan
    if: needs.plan.outputs.unitShards != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && needs.plan.outputs.release != 'true' && '[22]' || '[22, 24, 26]') }}
        shard: ${{ fromJSON(needs.plan.outputs.unitShards) }}
    name: test (${{ matrix.node }}, ${{ matrix.shard }}/${{ needs.plan.outputs.unitShardCount }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build # the page script is built from src/, not kept in git
      - run: node --check local.mjs && node --check src/comments.js && node --check public/_lab/comments.js && node --check lib/comments-api.mjs
      # npm test's own command with the shard; a failing test is named as an error on the PR and in the summary.
      - run: node ci/unit-run.mjs --test-shard=${{ matrix.shard }}/${{ needs.plan.outputs.unitShardCount }}
        env:
          UNIT_FILES: ${{ needs.plan.outputs.unit }}

  # Windows (#544: 0.8.2 exited on every start there): starting a lab the ways people do, on a Windows runner. Its own
  # file, test/windows.test.mjs, which also runs with the other unit tests on Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: node --import ./test/setup.mjs --test test/windows.test.mjs

  # Two quick checks in one job:
  # - Dead code: files nothing imports, and exports nothing outside their own file uses. Knip runs from npx,
  #   pinned, so labit keeps zero dependencies; knip.json lists the entry points.
  # - Reuse: one drawer, one dimmed page, shared gestures, keyboard fit, animations and styles (ci/reuse.mjs).
  #   Something new is listed in ci/parts.json on purpose, in the same pull request.
  # - Classes: a class the script names has a CSS rule, and a styled class is named by the script (ci/classes.mjs).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run reuse
      - run: npm run classes
      - run: npm run deadcode

  # Which browser tests this PR needs (ci/affected.mjs): from the files it changes, docs and CI-only PRs run none, a
  # widget module runs the tests that reach it, and src/comments.js, styles, the server, package.json or the build run
  # all. Merges to main run none (tested in their PR) unless they bump the version; a release and a run started by hand
  # run every test. The picked tests are packed into shards of about the same length from each file's time in
  # ci/browser-tests.json, up to 10 jobs at once. The reasons and the shards are in this job's summary.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the newest reach map, from reach.yml
    outputs:
      tests: ${{ steps.pick.outputs.tests }}
      native: ${{ steps.pick.outputs.native }}
      bench: ${{ steps.pick.outputs.bench }}
      jobs: ${{ steps.pick.outputs.jobs }}
      unit: ${{ steps.pick.outputs.unit }}
      unitShards: ${{ steps.pick.outputs.unitShards }}
      unitShardCount: ${{ steps.pick.outputs.unitShardCount }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20 # a PR's merge with base (HEAD^1 is base), and on main the commit before the push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The newest reach map from main (reach.yml): a PR then runs the browser tests that reach the lines and CSS rules it
      # changes. Without one, ci/affected.mjs goes by its hand-made list.
      - name: Reach map
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest finished run that has the map: a run can end without one, and a night with a failed part ends
          # red with a map (the failed part's tests always run).
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w reach.yml -b main -s completed -L 10 --json databaseId --jq '.[].databaseId' || true); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n reach-map -D ci 2>/dev/null && { echo "reach map from run $id"; break; }
          done
          [ -f ci/reach-map.json ] || echo "no reach map: every test runs"
      - id: pick
        env:
          # A PR runs Safari's engine only (Leo, 20 Nov: half the work per PR; Safari is where labit is used most).
          # A release PR (a version bump) runs both, ci/affected.mjs adds Chrome's; "Run workflow" runs both by hand.
          ENGINES: ${{ github.event_name == 'pull_request' && 'webkit' || 'webkit,chromium' }}
        run: |
          # A PR: its merge with base (HEAD^1 is base). A merge to main was tested in its PR, so it runs no browser
          # test: a release ran every one in its release PR, before publish.yml put it on npm (Leo, 27 Nov).
          if [ "${{ github.event_name }}" = pull_request ]; then
            node ci/affected.mjs HEAD^1 HEAD
          elif [ "${{ github.ref }}" = refs/heads/main ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            node ci/affected.mjs --main "${{ github.event.before }}" HEAD
          else
            node ci/affected.mjs --all
          fi

  # The widget in real browsers: Safari's engine (WebKit) and Chrome's. Playwright is installed only here (--no-save),
  # so labit itself keeps zero dependencies. One job per shard the plan made, side by side.
  # On GitHub's runners (Leo, 24 Nov: free for a public repo; only the iOS simulator stays on his Mac): WebKit on macOS,
  # Safari's own engine (on Linux, WebKit's frames, wheel scrolling and timing differ: sheetrelease, motionreduce and
  # cardscroll failed there), Chromium on Linux. Playwright's browsers are cached per version.
  browser:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # a hung browser fails here instead of holding the PR for half an hour
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: browser (${{ matrix.engine }} ${{ matrix.shard }})
    env:
      ENGINES: ${{ matrix.engine }}
      BROWSER_JOBS: 2 # two test files at a time: the runner's cores sit idle while a test waits on its browser
      # anchoring-torture: one seed of generated pages on a PR (about 35 s in WebKit), both on main and by hand, where
      # its KNOWN list is kept.
      TORTURE_SEEDS: ${{ github.event_name == 'pull_request' && needs.plan.outputs.release != 'true' && '1' || '1,2' }}
    steps:
      - run: echo "Running ${{ matrix.files || 'nothing' }}${{ matrix.bench && ' and the bench' || '' }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-1.65.1-${{ runner.os }}-${{ matrix.engine }}
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.engine }}${{ (matrix.bench || matrix.native) && ' chromium' || '' }}
      - run: npm run build # the page script is built from src/, not kept in git
      - name: Run ${{ matrix.engine }} ${{ matrix.shard }}
        if: matrix.files != ''
        # ci/browser-run.mjs: each file once more when it fails (a warning), the failing checks' own lines as errors on
        # the PR and in the summary, each file's time ("took N s") for ci/browser-tests.json, ci/flaky.json's quarantine.
        run: node ci/browser-run.mjs ${{ matrix.files }}
      # Agent readability: pins on a photo, a code line and a video second must be findable from the link alone. Once
      # per run, in the first WebKit shard (bench/run.mjs starts Chrome itself).
      - if: matrix.bench
        run: node bench/run.mjs
      # Native features (ci/native.mjs): what Safari's engine and Chrome's can do that labit could use, as a table in the
      # job's summary. Fails only when a feature labit uses goes missing from one of them. In the first WebKit shard, so
      # it takes none of the five macOS runners of its own.
      - if: matrix.native
        run: node ci/native.mjs
        env:
          ENGINES: webkit,chromium # both engines, whatever this shard's engine is

  # One required check name for main's rule, green only when every unit job is, or when the plan picked no unit test.
  unit:
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    name: unit
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success
          test "${{ needs.test.result }}" = success || { test "${{ needs.test.result }}" = skipped && test '${{ needs.plan.outputs.unitShards }}' = '[]'; }

  # One required check name for main's rule, green only when every browser job is, or when the plan picked no
  # browser test at all (a docs or CI-only PR).
  browser-all:
    if: always()
    needs: [plan, browser]
    runs-on: ubuntu-latest
    name: browser
    steps:
      - run: |
          test "${{ needs.plan.result }}" = success
          test "${{ needs.browser.result }}" = success || { test "${{ needs.browser.result }}" = skipped && test '${{ needs.plan.outputs.jobs }}' = '[]'; }
