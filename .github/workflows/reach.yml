# The reach map (ci/reach.mjs): which lines of the widget and the server, and which of the widget's CSS classes, each
# browser test reaches, in Chromium. test.yml's plan job takes the newest one from here and runs a PR's browser tests
# for the lines and rules it changes, instead of all of them. Made again after each merge to main that changes code or
# tests (only the newest run goes on; 4 min on Leo's Mac), and by hand ("Run workflow").
name: reach
on:
  push:
    branches: [main]
    paths: ['src/**', 'lib/**', 'local.mjs', 'test/browser/**', 'ci/browser-tests.json', 'ci/reach*.mjs', 'scripts/build-widget.mjs']
  workflow_dispatch:
concurrency:
  group: reach
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  map:
    runs-on: [self-hosted, labit-mac]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright@1.65.1
      - run: node ci/reach.mjs --jobs 4 --out "$RUNNER_TEMP/reach-map.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reach-map
          path: ${{ runner.temp }}/reach-map.json
          retention-days: 30
