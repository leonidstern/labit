# Publishes labit to npm by itself, only for a release: whenever package.json on main has a version npm doesn't
# have yet (a release bump), it goes out as `latest`, tagged vX.Y.Z, with a GitHub release whose notes are that
# version's CHANGELOG section (made on any run where it's missing, so a manual run can add one late). Merges
# without a bump publish nothing (Leo, 18 Nov: not every merge to npm; his own labs run main + open PRs, built on
# his Mac). The `next` tag that every merge used to update stays at its last version.
#
# No token: npm trusted publishing (OIDC). One-time setup on npmjs.com, package settings → Trusted publisher →
# GitHub Actions, repository leonidstern/labit, workflow publish.yml. Each version also gets a provenance statement.
name: publish

on:
  # Only a merge that changes package.json (a release bump) or CHANGELOG.md (late notes) can have anything to do.
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write # the vX.Y.Z tag
  actions: write # starts waste.yml on that tag (a tag pushed with this token starts no workflow by itself)
  id-token: write # trusted publishing

jobs:
  publish:
    if: github.ref == 'refs/heads/main' # "Run workflow" on another branch publishes nothing
    concurrency:
      group: publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit that set the version, for its tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Which versions
        id: v
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then release=0; else release=1; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release: $([ $release = 1 ] && echo "$version → latest" || echo "none, $version is on npm")" >> "$GITHUB_STEP_SUMMARY"
          # The tag apart from npm: a tag push that failed after the publish is made on the next run (a rerun of this
          # one, or "Run workflow" on main), on the commit that set the version.
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then tag=1; else tag=0; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # No tests here: a release is tested whole in its release PR (both engines, Node 22/24/26), and main's rule
      # merges it only green (Leo, 27 Nov: fast releases). The merge goes to npm in about a minute.
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Release (latest)
        if: steps.v.outputs.release == '1'
        run: npx --yes npm@11.6.2 publish --access public --provenance

      # On the commit that set the version (the release's merge), not on a later merge that reran this.
      - name: Tag the release
        id: tag
        if: steps.v.outputs.tag == '0'
        env:
          V: v${{ steps.v.outputs.version }}
        run: |
          c=$(git log -1 --format=%H -G'^[[:space:]]*"version":' -- package.json)
          git tag "$V" "$c"
          git push origin "$V"

      # Colabits load the widget from labit's latest release through jsDelivr (co/vercel.json): its copy of
      # @latest is dropped at once, so every colabit has the new one within minutes instead of jsDelivr's 12 hours.
      - name: Colabits on the new release
        if: steps.v.outputs.release == '1'
        run: curl -fsS https://purge.jsdelivr.net/gh/leonidstern/labit@latest/co/co.js || echo "couldn't purge jsDelivr (colabits update within 12 hours)"

      - name: Waste check on the tag
        if: steps.tag.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run waste.yml --ref "v${{ steps.v.outputs.version }}" || echo "couldn't start waste.yml (the release itself is out)"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null || { echo "no tag v$VERSION yet"; exit 0; }
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo "release v$VERSION exists"; exit 0; }
          awk -v h="## $VERSION " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\nnpx @leonidstern/labit@%s\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --latest --title "labit $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
