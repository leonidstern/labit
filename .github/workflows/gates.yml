# Size, dependency, lint and README-claim gate. Zero secrets: runs on every PR, forks included.
# Tests stay in test.yml; this only measures, so it takes seconds.
#
# - The PR is compared with its own base commit. No baseline file, nothing pushed.
# - Both sides are measured with the base branch's judge (ci/), so a PR can't change how it's judged.
# - Both sides use the PR's tsconfig.json, so a PR tightening a type rule isn't blamed for old problems.
name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out base (also the judge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out PR (merged with base)
        uses: actions/checkout@v4
        with:
          path: pr
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The page script is built from src/, not kept in git: both trees build it before they are measured.
      - run: (cd base && npm run build) && (cd pr && npm run build)

      - name: Measure base
        env:
          JUDGE_METRICS: base/ci/metrics.mjs
        run: bash base/ci/measure.sh base "$RUNNER_TEMP/base.json" pr

      # A release (package.json's version differs from base's): the PR side must also have a fresh co/co.js
      # (staleBuild). Base is measured without it, so a stale copy on both sides still fails.
      - name: A release?
        id: rel
        run: |
          v() { node -p "require('./$1/package.json').version"; }
          echo "release=$([ "$(v base)" != "$(v pr)" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Measure PR
        env:
          JUDGE_METRICS: base/ci/metrics.mjs
          RELEASE: ${{ steps.rel.outputs.release }}
        run: bash base/ci/measure.sh pr "$RUNNER_TEMP/pr.json"

      - name: Compare PR with base
        env:
          ALLOW_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') && '1' || '0' }}
        run: |
          node base/ci/metrics.mjs compare "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/base.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
