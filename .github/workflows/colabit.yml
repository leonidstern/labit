# Colabits load the widget from labit's main through jsDelivr (co/vercel.json): when a merge changes it (co/co.js),
# jsDelivr's copy is dropped at once, so every colabit has the new one within minutes instead of jsDelivr's 12 hours.
name: colabit
on:
  push:
    branches: [main]
    paths: [co/co.js]
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://purge.jsdelivr.net/gh/leonidstern/labit@main/co/co.js
