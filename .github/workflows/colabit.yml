# Colabits deployed before 0.8.6 load the widget from labit's main through jsDelivr (their co/vercel.json says @main;
# new ones follow the latest release, publish.yml): when a merge changes it (co/co.js), jsDelivr's copy of main is dropped
# at once, so those colabits have the new one within minutes instead of jsDelivr's 12 hours.
name: colabit
on:
  push:
    branches: [main]
    paths: [co/co.js]
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://purge.jsdelivr.net/gh/leonidstern/labit@main/co/co.js
